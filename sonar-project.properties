# Proyecto SonarQube de la BASE DE DATOS (scripts SQL de dbgestor + capa Node que los valida)
sonar.projectKey=microservicio-bd
sonar.projectName=Microservicio BD - dbgestor (MariaDB)
sonar.sourceEncoding=UTF-8

# sql/ contiene los scripts; src/ y bin/ el cargador, el lint y las validaciones
sonar.sources=sql,src,bin
sonar.tests=test
sonar.exclusions=**/node_modules/**,**/coverage/**,**/dist/**,**/target/**

# SonarQube no calcula cobertura de SQL. La cobertura reportada corresponde a la capa JavaScript (Jest).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
